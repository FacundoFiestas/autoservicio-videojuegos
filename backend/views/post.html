<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autoservicio Admin | Agregar producto</title>

    
    <!-- Icono -->
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <div class="logo-container">
            <img class="logo-header" src="assets/logo.png" alt="logo">
        </div>

        <nav class="nav-container">
            <a href="index.html" class="nav-btn">Principal</a>
            <a href="post.html" class="nav-btn">Agregar</a>
            <a href="put.html" class="nav-btn">Modificar</a>
            <a href="get.html" class="nav-btn">Obtener</a>
            <a href="delete.html" class="nav-btn">Eliminar</a>
        </nav>
    </header>
    <main>
        <h2 class="titulo">Agregar producto</h2>
        
        <section id="cont-createProduct">
            <form id="form-createProduct">
                
                <label for="prodNombre">Nombre</label>
                <input type="text" name="nombre" id="prodNombre" required>

                <label for="prodCategoria">Categoría</label>
                <select name="tipo" id="prodCategoria" required>
                    <option value="pc">PC</option>
                    <option value="consola">Consola</option>
                </select>

                <label for="prodPrecio">Precio</label>
                <input type="number" name="precio" id="prodPrecio" min="1" required>


                <label for="prodImagen">Imagen</label>
                <input type="text" name="imagen" id="prodImagen" required>



                <input type="submit" value="Crear producto">

            </form>
        </section>
        <section id="contenedor-productos"></section>
    </main>

    <script>
        const urlBase = "http://localhost:3000";
        const contProductos = document.getElementById("cont-createProduct");
        const formCreateProduct = document.getElementById("form-createProduct");


        function validarFormulario(data) {
            const errores = [];

            if (!data.nombre || !data.precio || !data.imagen || !data.tipo) {
                errores.push("Hay campos incompletos");
            }

            if (data.precio < 0) {
                errores.push("El precio no es válido");
            }

            return errores;
        }


        function mostrarMensaje(tipo, mensaje) {
            contProductos.innerHTML = `
                <p class="mensaje ${tipo}">${mensaje}</p>
            `;
        }

        function mostrarListaErrores(array) {
            let htmlErrores = "";
            array.forEach(error => {
                htmlErrores += `<p class="mensaje">${error}</p>`
            });

            contProductos.innerHTML = htmlErrores;
        }


        formCreateProduct.addEventListener("submit", async event => {
            
            event.preventDefault();

            const formData = new FormData(event.target);

            const formObj = Object.fromEntries(formData.entries());
            
            formObj.precio = Number(formObj.precio);
            formObj.nombre = formObj.nombre.trim();
            
            const errores = validarFormulario(formObj);

            if (errores.length > 0) {
                console.error(errores);
                return mostrarListaErrores(errores)
            };
            
            console.log(JSON.stringify(formObj));

            try {
                const response = await fetch(`${urlBase}/api/productos`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formObj)
                });

                const data = await response.json();

                if (!response.ok) {
                    if (data.listaErrores) {
                        return mostrarListaErrores(data.listaErrores);
                    }

                    return mostrarMensaje("error", data.message);
                }

                let mensaje = `${data.message} (ID ${data.data.id})`;
                console.log(data);
                mostrarMensaje("exito", mensaje);

            } catch (error) {
                console.error("Error al obtener productos: ", error);
                return mostrarMensaje("error", "Error de conexion con el servidor");
            }
    });

    </script>

    
</body>
</html>
