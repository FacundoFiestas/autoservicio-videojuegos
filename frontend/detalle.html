<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGames - Detalle del Producto</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .detalle-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 1.5rem;
        }
        .detalle-card {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            align-items: center;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.25);
            border-radius: 12px;
            padding: 1.5rem;
        }
        .detalle-img {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            border-radius: 8px;
        }
        .detalle-info h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        .detalle-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.2);
            margin-bottom: 1rem;
        }
        .detalle-precio {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 1rem 0;
        }
        .detalle-acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        .mensaje-estado {
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>AutoGames</h1>
        <nav>
            <a href="productos.html">← Volver al catálogo</a>
        </nav>
    </header>

    <main class="detalle-container">
        <div id="contenedor-detalle">
            <p class="mensaje-estado">Cargando detalles del producto...</p>
        </div>
    </main>

    <script src="js/detalle.js"></script>
</body>
</html>
